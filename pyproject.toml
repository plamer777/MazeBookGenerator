[project]
name = "maze-book-generator"
version = "0.1.0"
description = "Printable maze book generator for kids: PDF books with AI themes and illustrations (EN/RU)"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [
    { name = "plamer", email = "plamer777@mail.ru" },
]
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "reportlab>=4.2.0",
    "Pillow>=10.4.0",
    "pymongo>=4.10.1",
    "httpx>=0.27.0",
    "pdf2image>=1.17.0",
    "openai>=2.43.0",
    "craiyon-py>=1.2.0",
    "replicate>=1.0.7",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
